<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E8EEF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1924" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bus">
<title>Bus Commute</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='150 0 600 600'%3E%3Cpath fill='%23fff' d='M0 0H900V600H0'/%3E%3Cpath fill='%236cf' d='M900 150V600H150M0 450V0h750'/%3E%3Cg transform='translate(450 300)'%3E%3Cpath d='m-57-31h26v-26l31-31 31 31v26H57L88 0 57 31H31V57L0 88-31 57V31H-57L-88 0'/%3E%3Ccircle r='31' fill='%23fc3'/%3E%3C/g%3E%3C/svg%3E">
<link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #E8EEF1; --surface: #F7FAFB; --ink: #16263A; --muted: #56677A; --rule: #C6D2DA;
  --walk: #8394A4; --idle: #C6D2DA; --focus: #1E6FD9; --warn-bg: #FFF3D6; --warn-ink: #5C4300; --hurry: #B54708;
  --A: #EE3325; --B: #80BC00; --D: #333366; --A-ink: #fff; --B-ink: #10220A; --D-ink: #fff;
  --font: "Barlow", system-ui, sans-serif; --num: "Barlow Semi Condensed", "Barlow", system-ui, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1924; --surface: #152433; --ink: #E4ECF2; --muted: #98A8B6; --rule: #2B3D4F;
    --walk: #7A8C9C; --idle: #2B3D4F; --focus: #7FB2FF; --warn-bg: #3A2F12; --warn-ink: #F5DFA6; --hurry: #F5B05A;
    --D: #6A6ABF;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--font);
  padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
}
main { max-width: 560px; margin: 0 auto; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

/* Place pickers */
.pickers { padding: 12px 0 14px; display: grid; gap: 10px; }
.pick-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
.pick-label { color: var(--muted); font-size: 14px; }
.seg { display: flex; background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 3px; }
.seg button {
  flex: 1; border: 0; background: none; padding: 7px 4px; border-radius: 999px;
  font-weight: 500; font-size: 15px; cursor: pointer; white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }
.icon-btn {
  border: 1px solid var(--rule); background: var(--surface); width: 34px; height: 34px;
  border-radius: 50%; display: grid; place-items: center; cursor: pointer;
}

/* Status */
.status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--walk); flex: none; }
.status.live .dot { background: #2E9E5B; }
.status.off .dot { background: #C98A00; }
.statusbar { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
.statusbar .status { flex: 1; margin-bottom: 0; padding-top: 3px; }
.wx {
  flex: none; display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 3px 0;
  font: 600 15px/1 var(--num); color: var(--ink);
}
.wx.flag { padding: 4px 9px 4px 7px; border-radius: 999px; cursor: pointer; background: var(--wx-bg); color: var(--wx-ink); }
.wx svg { width: 15px; height: 15px; flex: none; }
.wx.storm { --wx-bg: #5B3FA8; --wx-ink: #fff; }
.wx.ice   { --wx-bg: #BDE6EC; --wx-ink: #0B3A40; }
.wx.snow  { --wx-bg: #CFE6FF; --wx-ink: #0F3557; }
.wx.rain  { --wx-bg: #2F6FD0; --wx-ink: #fff; }
.wx.air   { --wx-bg: #4F7F2A; --wx-ink: #fff; }
.wx.cold  { --wx-bg: #DCE4F7; --wx-ink: #1E2E5C; }
.wx.heat  { --wx-bg: #F8D9B4; --wx-ink: #6B3500; }
.wx.wind  { --wx-bg: #DDE3E8; --wx-ink: #2B3A47; }
@media (prefers-color-scheme: dark) {
  .wx.ice  { --wx-bg: #9FD3DB; }
  .wx.snow { --wx-bg: #B3D7FB; }
  .wx.rain { --wx-bg: #3F80E4; }
  .wx.air  { --wx-bg: #5C9134; }
  .wx.cold { --wx-bg: #C2CFEE; }
  .wx.heat { --wx-bg: #F2C48E; }
  .wx.wind { --wx-bg: #C9D2DA; }
}
.wx-notes { list-style: none; margin: 4px 0 8px; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--rule); font-size: 14px; }
.wx-notes li { display: flex; gap: 8px; align-items: flex-start; padding: 2px 0; }
.wx-notes svg { width: 16px; height: 16px; flex: none; margin-top: 2px; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
a { color: inherit; }

/* Hero */
.hero { padding: 6px 0 18px; }
.hero .lead { font: 600 24px/1.15 var(--num); margin: 0 0 2px; }
.hero .lead.hurry { color: var(--hurry); }
.hero h1 {
  font: 600 clamp(60px, 18vw, 88px)/0.95 var(--num); letter-spacing: -0.01em; margin: 0 0 10px;
  display: flex; align-items: center; gap: 12px;
}
.hero .note { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-ink); font-size: 15px; max-width: none; }
.hero p { margin: 0; font-size: 18px; line-height: 1.35; max-width: 34ch; }
.hero .muted { color: var(--muted); font-size: 15px; margin-top: 4px; }
.badge {
  display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 7px;
  font: 700 17px/1 var(--num); vertical-align: -5px; margin-right: 2px;
}
.badge.A { background: var(--A); color: var(--A-ink); }
.badge.B { background: var(--B); color: var(--B-ink); }
.badge.D { background: var(--D); color: var(--D-ink); }
.badge.sm { min-width: 22px; height: 22px; font-size: 14px; border-radius: 6px; vertical-align: -4px; }
.badge.lg { min-width: 0.7em; height: 0.7em; font-size: 1em; padding: 0 0.12em; border-radius: 0.14em; }
.badge.lg span { font-size: 0.62em; }

/* Alerts */
.alert { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 12px; margin: 0 0 14px; font-size: 14px; }
.alert summary { cursor: pointer; font-weight: 600; }
.alert p { margin: 8px 0 0; }

/* Timeline */
.board { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 12px 14px 4px; }
.axis { position: relative; height: 18px; margin: 0 0 4px; font: 500 12px/1 var(--num); color: var(--muted); }
.axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.axis span:first-child { transform: none; }
.axis span:last-child { transform: translateX(-100%); }
.opt { border-top: 1px solid var(--rule); padding: 12px 0; }
.opt:first-of-type { border-top: 0; }
.opt-head {
  display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 8px; width: 100%;
  background: none; border: 0; padding: 0; text-align: left; cursor: pointer;
}
.opt-name { font-weight: 600; font-size: 16px; }
.opt-sub { color: var(--muted); font-size: 13px; display: block; font-weight: 400; }
.opt-plan { display: block; font-size: 14px; margin-top: 1px; }
.opt-hurry { display: block; font-size: 13px; color: var(--hurry); font-weight: 500; }
.opt-when.hurry { color: var(--hurry); }
.opt-when { font: 600 20px/1.1 var(--num); text-align: right; white-space: nowrap; }
.opt-when small { display: block; font: 500 12px/1.2 var(--font); color: var(--muted); }
.opt.best .opt-name::after { content: "Best"; font: 600 11px/1 var(--font); background: var(--ink); color: var(--bg); padding: 3px 6px; border-radius: 4px; margin-left: 8px; vertical-align: 2px; }
.bar { position: relative; height: 14px; margin: 10px 0 2px; border-radius: 4px; background: repeating-linear-gradient(90deg, var(--idle) 0 2px, transparent 2px 8px) center / 100% 2px no-repeat; }
.bar i { position: absolute; top: 0; height: 100%; border-radius: 3px; }
.bar i.walk { background: repeating-linear-gradient(135deg, var(--walk) 0 3px, transparent 3px 6px); border: 1px solid var(--walk); }
.bar i.wait { height: 6px; top: 4px; opacity: 0.45; }
.bar i.A { background-color: var(--A); } .bar i.B { background-color: var(--B); } .bar i.D { background-color: var(--D); }
.bar.tight { height: 10px; margin-top: 8px; }
.bar.tight i.A, .bar.tight i.B, .bar.tight i.D { background-image: repeating-linear-gradient(135deg, var(--surface) 0 3px, transparent 3px 7px); }
.bar.tight + .bar { margin-top: 5px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding: 10px 0 8px; border-top: 1px solid var(--rule); }
.legend b { display: inline-block; width: 18px; height: 8px; border-radius: 2px; vertical-align: 0; margin-right: 5px; }
.legend .lw { background: repeating-linear-gradient(135deg, var(--walk) 0 3px, transparent 3px 6px); border: 1px solid var(--walk); }
.legend .lr { background: var(--ink); }
.legend .lq { background: var(--ink); opacity: 0.45; height: 4px; vertical-align: 2px; }
.legend .lt { background: var(--ink) repeating-linear-gradient(135deg, var(--surface) 0 3px, transparent 3px 7px); }

.deps { list-style: none; margin: 10px 0 0; padding: 0; font-size: 14px; }
.deps li { display: grid; grid-template-columns: 4.4em 1fr auto; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--rule); align-items: baseline; }
.deps li.hd { border-top: 0; padding: 0; font-size: 12px; color: var(--muted); }
.deps .t { font: 600 16px/1 var(--num); }
.deps .t.hurry { color: var(--hurry); }
.deps .note { color: var(--muted); }
.deps .cx { text-decoration: line-through; color: var(--muted); }
.tag { font: 600 11px/1 var(--font); padding: 3px 6px; border-radius: 4px; border: 1px solid var(--rule); color: var(--muted); white-space: nowrap; }
.tag.live { border-color: #2E9E5B; color: #2E9E5B; }
.tag.late { border-color: #C0392B; color: #C0392B; }
.empty { color: var(--muted); font-size: 14px; padding: 4px 0 0; }

footer { color: var(--muted); font-size: 12px; margin-top: 18px; line-height: 1.5; }
footer p { margin: 0 0 6px; }

/* Settings sheet */
dialog { border: 0; border-radius: 16px; padding: 0; width: min(520px, calc(100vw - 24px)); max-height: 86vh; background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(10, 20, 30, 0.45); }
.sheet { padding: 18px 18px 8px; }
.sheet h2 { margin: 0 0 4px; font: 600 22px/1.2 var(--num); }
.sheet h3 { margin: 18px 0 6px; font-size: 15px; }
.sheet h4 { margin: 12px 0 2px; font-size: 13px; color: var(--muted); font-weight: 600; }
.sheet p { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
.field { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--rule); font-size: 14px; }
.field input[type=number] { width: 4.2em; }
.field select { font: 500 16px var(--font); padding: 6px 8px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); color: var(--ink); }
.field input { font: 500 16px var(--font); padding: 6px 8px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); color: var(--ink); }
.field.wide { grid-template-columns: 1fr; }
.field.wide input { width: 100%; }
.sheet-actions { display: flex; gap: 10px; justify-content: flex-end; padding: 12px 18px 16px; position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--rule); }
.btn { border: 1px solid var(--rule); background: var(--bg); padding: 9px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: left .4s ease, width .4s ease; } }
</style>
</head>
<body>
<main>
  <div class="pickers">
    <div>
      <div class="pick-head">
        <span class="pick-label" id="from-label">Starting from</span>
        <button class="icon-btn" type="button" id="open-settings" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
      <div class="seg" role="group" aria-labelledby="from-label" id="from-seg"></div>
    </div>
    <div>
      <div class="pick-head"><span class="pick-label" id="to-label">Going to</span></div>
      <div class="seg" role="group" aria-labelledby="to-label" id="to-seg"></div>
    </div>
  </div>

  <div class="statusbar">
    <div class="status" id="status" role="status"><span class="dot"></span><span id="status-text">Loading timetable</span></div>
    <span id="wx"></span>
  </div>
  <ul class="wx-notes" id="wx-notes" hidden></ul>
  <section class="hero" id="hero" aria-live="polite"></section>
  <div id="alerts"></div>
  <section class="board" id="board" aria-label="Your options"></section>

  <footer>
    <p id="feed-note"></p>
    <p>Data provided under license granted by City of Madison, WI, Metro Transit.</p>
    <p>Weather data by <a href="https://open-meteo.com/">Open-Meteo.com</a>.</p>
  </footer>
</main>

<dialog id="settings" aria-labelledby="settings-title">
  <form method="dialog" id="settings-form">
    <div class="sheet">
      <h2 id="settings-title">Settings</h2>
      <p>Saved on this phone only.</p>
      <div class="field"><label for="work">My work place</label><select id="work"><option value="campus">Campus</option><option value="downtown">Downtown</option></select></div>
      <div class="field wide"><label for="relay">Live data link (your Cloudflare relay)</label><input id="relay" type="url" inputmode="url" placeholder="https://commute-relay.yourname.workers.dev" autocomplete="off"></div>
      <div class="field"><label for="buffer">Minutes to be at the stop before the bus</label><input id="buffer" type="number" min="0" max="15" step="1"></div>
      <div class="field"><label for="xfer">Minutes needed to change buses</label><input id="xfer" type="number" min="0" max="15" step="1"></div>
      <h3>Walking minutes</h3>
      <p>Between each place and its stops, in either direction.</p>
      <div id="walk-fields"></div>
    </div>
    <div class="sheet-actions">
      <button class="btn" type="button" id="reset-settings">Reset</button>
      <button class="btn primary" value="save">Save</button>
    </div>
  </form>
</dialog>

<script>
// ---------- Your setup ----------
const DEFAULT_RELAY = "https://commute-relay.pkir.workers.dev"; // your Cloudflare Worker
const POLL_SECONDS = 30;  // Metro refreshes its feed about every 30 seconds
const HORIZON_MIN = 90;   // how far ahead to look
// Close calls: when another option arrives within this many minutes of the fastest one,
// prefer fewer bus changes above freezing and less walking at or below freezing.
const CLOSE_CALL_MIN = 5;
const FREEZING_F = 32;
// Weather comes from Open-Meteo (free, no key). Coordinates are the Capitol Square.
const WX_PLACE = "latitude=43.0747&longitude=-89.3841";
const WEATHER_URL = `https://api.open-meteo.com/v1/forecast?${WX_PLACE}&current=temperature_2m,precipitation,weather_code` +
  "&hourly=precipitation_probability,precipitation,snowfall,weather_code,apparent_temperature,wind_gusts_10m" +
  "&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timeformat=unixtime&forecast_days=2";
const WEATHER_URL_BASIC = `https://api.open-meteo.com/v1/forecast?${WX_PLACE}&current=temperature_2m&temperature_unit=fahrenheit`;
const AIR_URL = `https://air-quality-api.open-meteo.com/v1/air-quality?${WX_PLACE}&hourly=us_aqi&timeformat=unixtime&forecast_days=2`;
// Weather flags look this far ahead, and use these thresholds.
const WX_HOURS = 8;
const WX = { chance: 40, aqi: 100, gustMph: 35, coldFeelsF: 10, hotFeelsF: 90 };

const PLACES = { home: "Home", daycare: "Daycare", campus: "Campus", downtown: "Downtown" };
const ARRIVE = { home: "home", daycare: "at daycare", campus: "on campus", downtown: "downtown" };
// You only ever travel between the north-side pair and the work pair.
const GOES_TO = { home: ["campus", "downtown"], daycare: ["campus", "downtown"], campus: ["home", "daycare"], downtown: ["home", "daycare"] };
const NORTH = ["home", "daycare"], WORK = ["campus", "downtown"];

// Stop names by GTFS stop_id (not the 4-digit numbers on stop signs).
const STOP = {
  "218": "Commercial & North", "211": "Commercial & North", "581": "Johnson & North", "239": "North & Johnson",
  "2857": "Fourth Street", "2858": "Fourth Street", "2844": "East Campus", "2810": "University & Mills",
  "2864": "Orchard", "2865": "Orchard", "2896": "Johnson & Orchard", "1301": "Park & Dayton",
  "2847": "Capitol Square", "2848": "Capitol Square", "2083": "Gorham & Wisconsin",
};
// Walking minutes between a place and its stops. Stops that share a line share one walk time.
const WALKS = [
  { place: "home", stops: ["218", "211"], min: 4, label: "Commercial & North" },
  { place: "home", stops: ["581", "239"], min: 9, label: "Johnson & North" },
  { place: "daycare", stops: ["2857", "2858"], min: 3, label: "Fourth Street (E Wash & 4th)" },
  { place: "campus", stops: ["2844"], min: 7, label: "East Campus, by the Chazen" },
  { place: "campus", stops: ["2810"], min: 2, label: "University & Mills" },
  { place: "campus", stops: ["2864", "2865"], min: 3, label: "Orchard station" },
  { place: "campus", stops: ["2896"], min: 4, label: "Johnson & Orchard" },
  { place: "campus", stops: ["1301"], min: 9, label: "Park & Dayton" },
  { place: "downtown", stops: ["2847"], min: 6, label: "Capitol Square, Mifflin side (arriving)" },
  { place: "downtown", stops: ["2848"], min: 2, label: "Capitol Square, Main & MLK (leaving)" },
  { place: "downtown", stops: ["2083"], min: 8, label: "Gorham & Wisconsin (D)" },
];

// Route options for each trip. A second leg means changing buses.
const leg = (route, dir, from, to) => ({ route, dir, from, to });
const ROUTES = {
  "home>campus": [[leg("B", "B0", "218", "2844")], [leg("D", "D0", "581", "2810")]],
  "home>downtown": [[leg("B", "B0", "218", "2847")], [leg("D", "D0", "581", "2083")]],
  "daycare>campus": [[leg("A", "A0", "2857", "2864")], [leg("B", "B0", "2857", "2844")]],
  "daycare>downtown": [[leg("A", "A0", "2857", "2847")], [leg("B", "B0", "2857", "2847")]],
  "campus>home": [[leg("B", "B1", "1301", "211")], [leg("D", "D1", "2896", "239")],
                  [leg("A", "A1", "2865", "2858"), leg("B", "B1", "2858", "211")]],
  "campus>daycare": [[leg("A", "A1", "2865", "2858")], [leg("B", "B1", "1301", "2858")]],
  // No A-then-B option from downtown: the B it would connect to is the same bus that stops at Capitol Square first.
  "downtown>home": [[leg("B", "B1", "2848", "211")]],
  "downtown>daycare": [[leg("A", "A1", "2848", "2858")], [leg("B", "B1", "2848", "2858")]],
};
const OUR_ROUTES = new Set(["A", "B", "D"]);

function optionsFor(from, to) {
  return (ROUTES[`${from}>${to}`] || []).map((legs, i) => {
    const first = legs[0], last = legs[legs.length - 1];
    return {
      id: `${from}>${to}#${i}`, legs, from, to, route: first.route, stop: STOP[first.from],
      name: `${first.route} at ${STOP[first.from]}` + (legs[1] ? `, then ${legs[1].route}` : ""),

  const trip = f => f ? { tripId: str(f, 1), startDate: str(f, 3), rel: one(f, 4) || 0, routeId: str(f, 5) } : null;
  const event = f => f ? { delay: int32(one(f, 1)), time: one(f, 2) } : null;

    if (!f || !f[1]) return "";

// ---------- Storage (this phone only) ----------
const store = {

  set(k, v) { try { localStorage.setItem("commute." + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem("commute." + k); } catch {} },

    relay: (s.relay ?? DEFAULT_RELAY).replace(/\/+$/, ""),

}
const walkKey = w => `${w.place}:${w.stops[0]}`;
function walkMin(place, stopId) {
  const w = WALKS.find(x => x.place === place && x.stops.includes(stopId));

// ---------- State ----------
let SCHED = null, schedError = null, live = null, liveError = null, lastFetchOk = 0;
// GTFS times count from "noon minus 12 hours", which differs from midnight on clock-change days.
const dayInfo = d => ({
  ymd: `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`,
  weekday: (d.getDay() + 6) % 7, // Monday = 0
  midnight: new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12).getTime() / 1000 - 43200,
});
const today = () => dayInfo(new Date());
// Late-night buses belong to the previous day's service (listed as e.g. 24:30), so check both days.
function serviceDays() {
  const y = new Date(); y.setDate(y.getDate() - 1);
  return [dayInfo(y), today()].map(d => ({ midnight: d.midnight, active: activeServices(d) }));
}
function activeServices(t) {
  const on = new Set();
  for (const [sid, days, start, end] of SCHED.calendar) if (days[t.weekday] === "1" && start <= t.ymd && t.ymd <= end) on.add(sid);
  for (const [sid, date, type] of SCHED.dates) if (date === t.ymd) { if (type === "1") on.add(sid); else on.delete(sid); }
  return on;

// Opening trip: mornings go from home to this phone's work place, afternoons from the work place home.
// Daycare is one tap away in either picker.
const isMorning = () => new Date().getHours() < 12;
function initialTrip() {
  const work = settings().work;
  return isMorning() ? ["home", work] : [work, "home"];
}
let [from, to] = initialTrip();
function chooseFrom(f) {
  const sameSide = NORTH.includes(f) === NORTH.includes(from);
  from = f;
  if (!sameSide || !GOES_TO[f].includes(to)) to = NORTH.includes(f) ? settings().work : "home";
}
function chooseTo(t) { to = t; }
const expanded = new Set();

// ---------- Trip planning ----------
const evTime = s => s && ((s.departure && s.departure.time) || (s.arrival && s.arrival.time));
function legTrips(leg, days, now) {
  const stops = SCHED.stopsByDir[leg.dir] || [];
  const fi = stops.indexOf(leg.from), ti = stops.indexOf(leg.to);
  if (fi < 0 || ti < 0) return null; // timetable is older than this page
  const iF = fi + 2, iT = ti + 2, out = [];
  for (const day of days) for (const r of SCHED.trips[leg.dir] || []) {
    if (!day.active.has(r[1]) || r[iF] == null || r[iT] == null) continue;
    const sDep = day.midnight + r[iF], sArr = day.midnight + r[iT];
    if (sArr < now - 3600 || sDep > now + (HORIZON_MIN + 60) * 60) continue;
    let dep = sDep, arr = sArr, status = "scheduled", delay = 0;
    const tu = live && live.byTrip.get(r[0]);
    if (tu) {
      if (tu.trip.rel === 3) status = "canceled";
      else {
        const m = new Map(tu.stops.map(s => [s.stopId, s]));
        const b = m.get(leg.from), a = m.get(leg.to);
        if (b && b.rel === 1) status = "canceled"; // skipped stop
        const bt = evTime(b), at = evTime(a);
        if (bt) { dep = bt; arr = at || sArr + (bt - sDep); status = status === "canceled" ? status : "live"; }
        else if (tu.stops.length && at) continue; // bus has already passed your stop
        else if (tu.stops.length && !at && sArr < now) continue;
        else if (Number.isFinite(tu.delay)) { dep += tu.delay; arr += tu.delay; status = "estimated"; }
        delay = dep - sDep;
      }
    }
    out.push({ tripId: r[0], route: leg.route, from: leg.from, sDep, dep, arr, status, delay });
  }
  return out.sort((x, y) => x.dep - y.dep);
}

function journeys(opt, days, now, s) {
  const [l1, l2] = opt.legs;
  const walkTo = walkMin(opt.from, l1.from) * 60, walkFrom = walkMin(opt.to, (l2 || l1).to) * 60, buf = s.buffer * 60;
  const first = legTrips(l1, days, now);
  const second = l2 ? legTrips(l2, days, now) : null;
  if (!first || (l2 && !second)) return null;
  const connecting = second && second.filter(x => x.status !== "canceled");
  const res = [];
  for (const j of first) {
    if (j.dep < now - 30) continue; // the bus has left your stop
    const leaveBy = j.dep - walkTo - buf;
    if (leaveBy > now + HORIZON_MIN * 60) break;
    // "tight": you can't reach the stop at your usual pace with your usual buffer.
    // "short": how many minutes faster than your usual walk you'd need to be.
    const tight = leaveBy < now - 30;
    const short = Math.max(0, Math.ceil((walkTo - (j.dep - now)) / 60));
    const out = { opt, leaveBy, legs: [j], arrive: j.arr + walkFrom, canceled: j.status === "canceled", missingTransfer: false,
      tight, short, walk: (walkTo + walkFrom) / 60 };
    if (connecting && !out.canceled) {
      const next = connecting.find(x => x.dep >= j.arr + s.xfer * 60);
      if (next) { out.legs.push(next); out.arrive = next.arr + walkFrom; }
      else { out.missingTransfer = true; out.arrive = Infinity; }
    }
    res.push(out);

}

// ---------- Weather (Open-Meteo, no key needed) ----------
let weather = store.get("weather2", null); // { tempF, at, cur, hourly, air }

const getJson = async url => { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); };
async function loadWeather() {
  if (document.hidden || (weather && Date.now() - weather.at < 10 * 60 * 1000)) return;
  const [fc, aq] = await Promise.allSettled([getJson(WEATHER_URL), getJson(AIR_URL)]);

// WMO weather codes used by Open-Meteo.
const SNOW_CODES = [71, 73, 75, 77, 85, 86], ICE_CODES = [56, 57, 66, 67], STORM_CODES = [95, 96, 99];
const AQI_LEVEL = v => v > 300 ? "hazardous" : v > 200 ? "very unhealthy" : v > 150 ? "unhealthy" : "unhealthy for sensitive groups";

// Things worth knowing before heading out in the next WX_HOURS hours, most important first.
function weatherFlags(nowSec) {
  if (!weather || Date.now() - weather.at > 2 * 3600 * 1000) return [];
  const flags = [], h = weather.hourly, end = nowSec + WX_HOURS * 3600;
  const hours = [];
  if (h?.time) h.time.forEach((t, i) => { if (t + 3600 > nowSec && t < end) hours.push({
    t: Math.max(t, nowSec), chance: h.chance?.[i] ?? 0, precip: h.precip?.[i] ?? 0, snow: h.snow?.[i] ?? 0,
    code: h.code?.[i], feels: h.feels?.[i], gust: h.gust?.[i] }); });
  const likely = x => x.chance > WX.chance;
  const at = x => (x.t <= nowSec + 1800 ? "now" : `around ${clock(x.t).replace(":00", "")}`);
  const first = test => hours.find(x => likely(x) && test(x));
  const maxBy = (key, test = () => true) => hours.filter(x => Number.isFinite(x[key]) && test(x)).sort((a, b) => b[key] - a[key])[0];
  const isSnow = x => SNOW_CODES.includes(x.code) || x.snow > 0;
  const isIce = x => ICE_CODES.includes(x.code);
  const gustiest = maxBy("gust");
  const windy = gustiest && gustiest.gust >= 25;

  const storm = first(x => STORM_CODES.includes(x.code));
  if (storm) flags.push({ kind: "storm", text: `Thunderstorms possible ${at(storm)} (${storm.chance}%). Bring a raincoat and check the sky before you head out.` });
  const ice = first(isIce);
  if (ice) flags.push({ kind: "ice", text: `Freezing rain possible ${at(ice)} (${ice.chance}%). Sidewalks may be icy; wear boots with grip.` });
  const snowingNow = SNOW_CODES.includes(weather.cur?.code);
  const snow = first(isSnow);
  if (snowingNow || snow) flags.push({ kind: "snow", text: snowingNow ? "Snowing now. Wear boots." : `Snow likely ${at(snow)} (${snow.chance}%). Wear boots.` });
  const rainingNow = weather.cur?.precip > 0 && !snowingNow;
  const rain = first(x => !isSnow(x) && !isIce(x) && !STORM_CODES.includes(x.code));
  if (rainingNow || rain) flags.push({ kind: "rain",
    text: (rainingNow ? "Raining now." : `Rain likely ${at(rain)} (${rain.chance}%).`) +
      (windy ? " It's windy too, so a raincoat beats an umbrella." : " Bring an umbrella or raincoat.") });
  if (weather.air?.time) {
    let worst = null;
    weather.air.time.forEach((t, i) => { const v = weather.air.aqi?.[i];
      if (t + 3600 > nowSec && t < end && Number.isFinite(v) && (!worst || v > worst.v)) worst = { t: Math.max(t, nowSec), v }; });
    if (worst && worst.v > WX.aqi) flags.push({ kind: "air", text: `Air quality may reach ${Math.round(worst.v)} (${AQI_LEVEL(worst.v)}) ${at(worst)}. Limit time outside; consider a mask.` });
  }
  const coldest = hours.filter(x => Number.isFinite(x.feels)).sort((a, b) => a.feels - b.feels)[0];
  if (coldest && coldest.feels <= WX.coldFeelsF) flags.push({ kind: "cold", text: `Feels like ${Math.round(coldest.feels)}°F ${at(coldest)}. Hat, gloves, and a scarf.` });
  const hottest = maxBy("feels");
  if (hottest && hottest.feels >= WX.hotFeelsF) flags.push({ kind: "heat", text: `Feels like ${Math.round(hottest.feels)}°F ${at(hottest)}. Bring water.` });
  if (gustiest && gustiest.gust >= WX.gustMph) flags.push({ kind: "wind", text: `Gusts up to ${Math.round(gustiest.gust)} mph ${at(gustiest)}.` });
  return flags;
}

const WX_ICON = {

  ice: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/><path d="M9.5 14.5h5"/>',

  heat: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  wind: '<path d="M3 9h11a3 3 0 1 0-3-3M3 15h15a3 3 0 1 1-3 3"/>',

const wxIcon = kind => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${WX_ICON[kind]}</svg>`;
let wxOpen = false;

// Pick the best option. Normally the earliest arrival wins; among options arriving within
// CLOSE_CALL_MIN of the earliest, the temperature decides what matters more.
const soonestFirst = (a, b) => a.arrive - b.arrive || b.leaveBy - a.leaveBy;
function pickBest(cands, tempF) {
  if (!cands.length) return { best: null, fastest: null, rule: null };
  const fastest = cands.slice().sort(soonestFirst)[0];
  const close = cands.filter(c => c.arrive <= fastest.arrive + CLOSE_CALL_MIN * 60);
  const changes = c => c.legs.length - 1;

  if (tempF != null && tempF > FREEZING_F) { rule = "fewer bus changes"; by = (a, b) => changes(a) - changes(b) || soonestFirst(a, b); }
  else if (tempF != null) { rule = "less walking"; by = (a, b) => a.walk - b.walk || soonestFirst(a, b); }

// ---------- Rendering ----------
const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderPickers() {
  const btns = (keys, cur, attr) => keys.map(k => `<button type="button" ${attr}="${k}" aria-pressed="${k === cur}">${PLACES[k]}</button>`).join("");
  $("#from-seg").innerHTML = btns(Object.keys(PLACES), from, "data-from");
  $("#to-seg").innerHTML = btns(GOES_TO[from], to, "data-to");
}

function render() {
  renderPickers();
  renderStatus();
  if (!SCHED) return;

  const t = today(), now = Date.now() / 1000, s = settings(), days = serviceDays();
  const opts = optionsFor(from, to);
  const rows = opts.map(opt => ({ opt, list: journeys(opt, days, now, s) }));
  const stale = rows.some(r => r.list === null);
  rows.forEach(r => { r.list ||= []; });
  const usable = j => !j.canceled && !j.missingTransfer;
  rows.forEach(r => {
    r.ok = r.list.find(j => usable(j) && !j.tight);                 // next bus you can walk to
    r.hurry = r.list.filter(j => usable(j) && j.tight).pop() || null; // latest bus you'd have to hurry for
  });
  const tempF = currentTemp();
  const { best, fastest, rule } = pickBest(rows.map(r => r.ok).filter(Boolean), tempF);

  // A bus you'd have to hurry for, worth mentioning if it gets you there sooner than the best pick.
  const hurryPick = rows.map(r => r.hurry).filter(h => h && (!best || h.arrive < best.arrive - 60))
    .sort((a, b) => a.short - b.short || a.arrive - b.arrive)[0];
  const hurryText = h => h.short > 0 ? `You'd need to walk about ${h.short} min faster than usual.` : "Go now and skip your usual buffer.";
  const busLine = (j, lead) => {
    const [a, b] = j.legs;
    const via = b ? `, then the ${badge(b.route, true)} at ${esc(STOP[b.from])} at ${clock(b.dep)}` : "";
    return `<p>${lead} ${esc(j.opt.stop)} in ${mins(a.dep - now)} min${via}. You'll be ${ARRIVE[to]} around ${clock(j.arrive)}.</p>`;
  };
  const bigTime = a => `<h1><span class="badge lg ${a.route}" aria-hidden="true"><span>${a.route}</span></span><span><span class="sr">Route ${a.route} bus at </span>${clock(a.dep)}</span></h1>`;

  // Hero
  if (best) {
    const lead = best.leaveBy - now;
    const a = best.legs[0];
    let why = "";
    if (rule && fastest && best !== fastest) {
      const later = mins(best.arrive - fastest.arrive);
      why = ` It's ${Math.round(tempF)}°F, so this pick has ${rule} than the ${esc(fastest.opt.name)}` +
        (later > 0 ? `, which arrives ${later} min sooner.` : ", which arrives at the same time.");
    }
    $("#hero").innerHTML = `<p class="lead">${lead < 45 ? "Leave now" : `Leave in ${mins(lead)} min`}</p>
      ${bigTime(a)}
      ${busLine(best, "Bus leaves")}
      <p class="muted">${a.status === "live" ? "Based on the bus's live position." : "Based on the timetable; no live position for this bus yet."}${why}</p>
      ${hurryPick ? `<p class="note"><b>Or hurry:</b> ${badge(hurryPick.legs[0].route, true)} from ${esc(hurryPick.opt.stop)} at ${clock(hurryPick.legs[0].dep)}, in ${mins(hurryPick.legs[0].dep - now)} min. ${hurryText(hurryPick)} You'd be ${ARRIVE[to]} around ${clock(hurryPick.arrive)}.</p>` : ""}`;
  } else if (hurryPick) {
    $("#hero").innerHTML = `<p class="lead hurry">Hurry</p>
      ${bigTime(hurryPick.legs[0])}
      ${busLine(hurryPick, "Bus leaves")}
      <p class="muted">${hurryText(hurryPick)} Nothing else leaves in the next ${HORIZON_MIN} minutes.</p>`;
  } else if (stale) {
    $("#hero").innerHTML = `<h1>Timetable needs updating</h1><p>Run the "Update bus schedule" action on GitHub so this page knows the stops for this trip.</p>`;
  } else {
    $("#hero").innerHTML = `<h1>No bus soon</h1><p>None of your options leave in the next ${HORIZON_MIN} minutes.</p>`;
  }

  // Timeline scale
  const ends = rows.map(r => (r.ok || r.hurry)?.arrive).filter(Boolean);
  const spanMin = Math.min(120, Math.max(40, Math.ceil(((Math.max(now + 1800, ...ends) - now) / 60 + 5) / 10) * 10));
  const pct = sec => Math.max(0, Math.min(100, ((sec - now) / (spanMin * 60)) * 100));
  const ticks = []; for (let m = 0; m <= spanMin; m += spanMin > 60 ? 20 : 10) ticks.push(m);
  const axis = `<div class="axis" aria-hidden="true">${ticks.map((m, i) => `<span style="left:${(m / spanMin) * 100}%">${i === 0 ? "now" : clock(now + m * 60)}</span>`).join("")}</div>`;

  const seg = (cls, s0, s1) => s1 > s0 ? `<i class="${cls}" style="left:${pct(s0)}%;width:${Math.max(0.6, pct(s1) - pct(s0))}%"></i>` : "";
  const track = j => {
    const [a, b] = j.legs;
    const start = j.tight
      ? seg("walk", now, a.dep) // hurrying: walk straight to the bus, no buffer
      : seg("walk", j.leaveBy, a.dep - s.buffer * 60) + seg("wait " + a.route, a.dep - s.buffer * 60, a.dep);
    return `<div class="bar${j.tight ? " tight" : ""}" aria-hidden="true">${start}${seg(a.route, a.dep, a.arr)}${b ? seg("wait " + b.route, a.arr, b.dep) + seg(b.route, b.dep, b.arr) : ""}${seg("walk", (b || a).arr, j.arrive)}</div>`;
  };
  const anyHurry = rows.some(r => r.hurry);

  const optHtml = rows.map(({ opt, list, ok, hurry }) => {
    const isBest = best && ok === best;
    const open = expanded.has(opt.id);
    const primary = ok || hurry;
    let when = `<span class="opt-when">None<small>next ${HORIZON_MIN} min</small></span>`;
    if (primary) {
      const busIn = mins(primary.legs[0].dep - now);
      when = `<span class="opt-when${ok ? "" : " hurry"}">${busIn < 1 ? "Now" : busIn + " min"}<small>bus ${clock(primary.legs[0].dep)}</small></span>`;
    }
    const plan = ok
      ? `<span class="opt-plan">${ok.leaveBy - now < 45 ? "Leave now" : `Leave by ${clock(ok.leaveBy)}`}, arrive ${clock(ok.arrive)}</span>` : "";
    const hurryLine = hurry
      ? `<span class="opt-hurry">Hurry: bus at ${clock(hurry.legs[0].dep)}${hurry.short > 0 ? `, walk ${hurry.short} min faster` : ", skip the buffer"}, arrive ${clock(hurry.arrive)}</span>` : "";
    const bars = (hurry ? track(hurry) : "") + (ok ? track(ok) : "");
    const deps = list.slice(0, 5).map(j => {
      const a = j.legs[0];
      const tag = a.status === "canceled" ? `<span class="tag late">Canceled</span>`
        : a.status === "live" ? `<span class="tag ${a.delay > 120 ? "late" : "live"}">${a.delay > 90 ? mins(a.delay) + " min late" : a.delay < -90 ? mins(-a.delay) + " min early" : "Live, on time"}</span>`
        : a.status === "estimated" ? `<span class="tag">Estimated</span>` : `<span class="tag">Timetable</span>`;
      const second = opt.legs[1];
      const note = j.canceled ? `<span class="cx">Bus at ${clock(a.sDep)}</span>`
        : j.missingTransfer ? `Bus ${clock(a.dep)}, no ${second.route} connection found`
        : `Bus ${clock(a.dep)} (${mins(a.dep - now)} min)${j.legs[1] ? `, ${j.legs[1].route} ${clock(j.legs[1].dep)}` : ""}, arrive ${clock(j.arrive)}`;
      const left = j.canceled ? "–" : j.tight ? "Hurry" : clock(j.leaveBy);
      return `<li><span class="t${j.tight && !j.canceled ? " hurry" : ""}">${left}</span><span class="note">${note}</span>${tag}</li>`;
    }).join("");
    return `<div class="opt${isBest ? " best" : ""}">
      <button class="opt-head" type="button" aria-expanded="${open}" data-opt="${esc(opt.id)}">
        <span><span class="opt-name">${badge(opt.route, true)} ${esc(opt.name)}</span>${plan}<span class="opt-sub">${esc(opt.sub)}, ${walkMin(opt.from, opt.legs[0].from)} min walk to the stop</span>${hurryLine}</span>
        ${when}
      </button>
      ${bars}
      ${open ? (deps ? `<ul class="deps"><li class="hd"><span>Leave by</span><span></span><span></span></li>${deps}</ul>` : `<p class="empty">No buses in the next ${HORIZON_MIN} minutes.</p>`) : ""}
    </div>`;
  }).join("");

  $("#board").innerHTML = axis + optHtml + `<div class="legend" aria-hidden="true"><span><b class="lw"></b>Walk</span><span><b class="lq"></b>Wait at stop</span><span><b class="lr"></b>On the bus</span>${anyHurry ? `<span><b class="lt"></b>Only if you hurry</span>` : ""}<span>Tap an option for more times</span></div>`;

  // Alerts for the routes and stops on this trip
  const ourStops = new Set(opts.flatMap(o => o.legs.flatMap(l => [l.from, l.to])));
  const routes = new Set(opts.flatMap(o => o.legs.map(l => l.route)));
  const alerts = (live?.alerts || []).filter(a =>
    (a.routes.some(r => routes.has(r)) || a.stops.some(x => ourStops.has(x))) &&
    (!a.periods.length || a.periods.some(([st, en]) => (!st || st <= now) && (!en || en >= now))));
  $("#alerts").innerHTML = alerts.map(a => `<details class="alert"><summary>${esc(a.header || "Service alert")}</summary>${a.description ? `<p>${esc(a.description)}</p>` : ""}</details>`).join("");

  // Footer: schedule validity
  const end = SCHED.feedEnd;
  const endTxt = end ? `${end.slice(4, 6)}/${end.slice(6)}/${end.slice(0, 4)}` : "unknown";
  $("#feed-note").textContent = t.ymd > end
    ? `The timetable expired on ${endTxt}. Run the "Update bus schedule" action on GitHub to load the new one.`
    : `Timetable valid through ${endTxt}.`;
}

function renderWeather() {
  const tf = currentTemp(), box = $("#wx"), notes = $("#wx-notes");
  if (tf == null) { box.innerHTML = ""; notes.hidden = true; return; }
  const flags = weatherFlags(Date.now() / 1000);
  const temp = `${Math.round(tf)}°F`;
  if (!flags.length) { wxOpen = false; box.innerHTML = `<span class="wx">${temp}</span>`; notes.hidden = true; return; }
  const kinds = [...new Set(flags.map(f => f.kind))];
  box.innerHTML = `<button type="button" class="wx flag ${kinds[0]}" id="wx-btn" aria-expanded="${wxOpen}" aria-controls="wx-notes"
    aria-label="${temp}. Weather notes: ${esc(flags.map(f => f.kind).join(", "))}">${kinds.slice(0, 3).map(wxIcon).join("")}${temp}</button>`;
  notes.innerHTML = flags.map(f => `<li>${wxIcon(f.kind)}<span>${esc(f.text)}</span></li>`).join("");
  notes.hidden = !wxOpen;
}

function renderStatus() {
  const el = $("#status"), txt = $("#status-text"), s = settings();
  renderWeather();
  el.classList.remove("live", "off");
  if (!SCHED) { txt.textContent = schedError ? "Couldn't load the timetable. Check that schedule.json is in the repo." : "Loading timetable"; return; }
  if (!s.relay) { el.classList.add("off"); txt.textContent = "Timetable only. Add your live data link in Settings."; return; }
  if (live && Date.now() - lastFetchOk < 3 * 60 * 1000) {
    const age = Math.max(0, Math.round(Date.now() / 1000 - live.timestamp));
    el.classList.add("live");
    txt.textContent = age < 60 ? "Live, Metro updated under a minute ago" : `Live, Metro updated ${Math.round(age / 60)} min ago`;
  } else if (liveError) {
    el.classList.add("off"); txt.textContent = "Can't reach live data right now. Showing the timetable.";
  } else txt.textContent = "Getting live data";
}

// ---------- Data loading ----------
async function loadSchedule() {
  try {
    if (window.SCHEDULE_DATA) { SCHED = window.SCHEDULE_DATA; return; }
    const r = await fetch("schedule.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    SCHED = await r.json();
  } catch (e) { schedError = e; }
}
let inflight = false;
async function loadLive() {
  const relay = settings().relay;
  if (!relay || inflight || document.hidden) return;
  inflight = true;
  try {
    const [tr, al] = await Promise.all(["trips", "alerts"].map(p => fetch(`${relay}/${p}`, { cache: "no-store" })));
    if (!tr.ok) throw new Error("trips " + tr.status);
    const t = GTFSRT.decode(await tr.arrayBuffer());
    const a = al.ok ? GTFSRT.decode(await al.arrayBuffer()) : { alerts: [] };
    const byTrip = new Map();
    for (const u of t.tripUpdates) if (u.trip && OUR_ROUTES.has(u.trip.routeId)) byTrip.set(u.trip.tripId, u);
    live = { timestamp: t.timestamp, byTrip, alerts: a.alerts };
    lastFetchOk = Date.now(); liveError = null;
  } catch (e) { liveError = e; }
  finally { inflight = false; render(); }
}

// ---------- Events ----------
document.addEventListener("click", e => {
  if (e.target.closest("#wx-btn")) { wxOpen = !wxOpen; renderWeather(); return; }
  const f = e.target.closest("[data-from]");
  if (f) { chooseFrom(f.dataset.from); render(); return; }
  const t = e.target.closest("[data-to]");
  if (t) { chooseTo(t.dataset.to); render(); return; }
  const o = e.target.closest("[data-opt]");
  if (o) { const id = o.dataset.opt; expanded.has(id) ? expanded.delete(id) : expanded.add(id); render(); }
});

const dlg = $("#settings");
function fillSettings() {
  const s = settings();
  $("#relay").value = s.relay; $("#buffer").value = s.buffer; $("#xfer").value = s.xfer; $("#work").value = s.work;
  $("#walk-fields").innerHTML = Object.keys(PLACES).map(p => `<h4>${PLACES[p]}</h4>` +
    WALKS.filter(w => w.place === p).map(w => `<div class="field"><label for="w-${walkKey(w)}">${esc(w.label)}</label>
      <input id="w-${walkKey(w)}" type="number" min="0" max="40" data-walk="${walkKey(w)}" value="${walkMin(w.place, w.stops[0])}"></div>`).join("")
  ).join("");
}
$("#open-settings").addEventListener("click", () => { fillSettings(); dlg.showModal(); });
$("#reset-settings").addEventListener("click", () => { store.del("settings"); fillSettings(); });
dlg.addEventListener("close", () => {
  if (dlg.returnValue !== "save") return;
  const num = (v, d) => (v === "" || !Number.isFinite(Number(v)) ? d : Number(v));
  const walks = {};
  document.querySelectorAll("[data-walk]").forEach(i => { if (i.value !== "") walks[i.dataset.walk] = Number(i.value); });
  store.set("settings", { relay: $("#relay").value.trim(), buffer: num($("#buffer").value, 1), xfer: num($("#xfer").value, 1), walks, work: $("#work").value });
  [from, to] = initialTrip();
  live = null; liveError = null; render(); loadLive();
});

// Phones often resume a home-screen page instead of reloading it, so reset the trip after a long break.
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt > 20 * 60 * 1000) [from, to] = initialTrip();
  render(); loadLive(); loadWeather();
});
setInterval(render, 15000);
setInterval(loadLive, POLL_SECONDS * 1000);
setInterval(loadWeather, 10 * 60 * 1000);

(async () => { render(); await loadSchedule(); render(); loadLive(); loadWeather(); })();
</script>
</body>
</html>
