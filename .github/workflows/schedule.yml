name: Update bus schedule

on:
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  schedule:
    - cron: "41 10 * * 1"   # Mondays, early morning Madison time
  push:
    paths: ["build_schedule.py"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build schedule.json from Metro's GTFS
        run: python build_schedule.py
      - name: Commit if changed
        run: |
          if git diff --quiet --exit-code -- schedule.json 2>/dev/null && git ls-files --error-unmatch schedule.json >/dev/null 2>&1; then
            echo "Schedule unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add schedule.json
            git commit -m "Update bus schedule"
            git push
          fi
